<text x="60" y="828" font-size="12" fill="#374151">1. У провода отрезать штекер «папа», зачистить ~1 см, накрутить на усик 3–4 витка и прижать.</text>
<text x="60" y="846" font-size="12" fill="#374151">2. Каждую скрутку — в изоленту или термоусадку: голые скрутки не должны касаться ни друг друга, ни платы.</text>
<text x="60" y="864" font-size="12" fill="#374151">3. В скрутку кнопки входят: усик кнопки + усик лампочки + провод GND (у кнопок 1–3 — два провода GND: к соседям).</text>
<text x="60" y="882" font-size="12" fill="#374151">4. Перед подключением сверить подписи контактов на самой плате. Если лампочки не горят — скрутки на 3V3, COMMON_TO_GND = false.</text>
</svg>